name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  analyze:
    name: flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

  test:
    name: flutter test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: stable
      - run: flutter pub get
      - run: flutter test --no-pub --reporter expanded

  android-build:
    name: android plugin build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: stable
      - name: Pub get
        run: flutter pub get
      - name: Pub get (example)
        working-directory: example
        run: flutter pub get
      - name: Compile plugin Java sources
        run: |
          # The plugin module on its own does not bootstrap a Gradle wrapper,
          # so compile the Java sources directly against the bundled JARs +
          # the Android & Flutter SDK jars. This catches regressions in
          # Printer.java / BluetoothDiscoverer.java without needing a host app.
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          FLUTTER_JAR="$(dirname $(which flutter))/cache/artifacts/engine/android-arm/flutter.jar"
          if [ ! -f "$ANDROID_JAR" ]; then
            sdkmanager "platforms;android-34" >/dev/null
          fi
          mkdir -p build/classes
          javac \
            -source 17 -target 17 \
            -cp "$ANDROID_JAR:$FLUTTER_JAR:android/libs/*" \
            -d build/classes \
            android/src/main/java/com/rubdev/zebrautil/*.java

  vendored-sha:
    name: vendored binary SHA-256 verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify SHAs match docs/vendored.sha256
        run: shasum -a 256 -c docs/vendored.sha256
      - name: Block undeclared vendored binaries
        run: |
          set -euo pipefail
          # Every binary under android/libs/ and ios/*.a must appear in the
          # manifest; if a new one is committed without a matching SHA line,
          # this check fails.
          declared=$(awk 'NF==2 {print $2}' docs/vendored.sha256 | sort -u)
          actual=$(find android/libs -type f \( -name '*.jar' -o -name '*.aar' \) -print 2>/dev/null; \
                   find ios -maxdepth 1 -type f -name '*.a' -print 2>/dev/null)
          actual=$(echo "$actual" | sort -u)
          missing=$(comm -23 <(echo "$actual") <(echo "$declared"))
          if [ -n "$missing" ]; then
            echo "::error::Vendored binaries committed without an entry in docs/vendored.sha256:" 1>&2
            echo "$missing" 1>&2
            exit 1
          fi

  dependency-check:
    name: OWASP dependency-check (advisory)
    runs-on: ubuntu-latest
    # Advisory: this job posts findings but does not block the PR. The plugin
    # transitively bundles Zebra Link-OS SDK 2.14 with known-vulnerable JARs
    # (Jackson 2.2.3 etc.) — tracked in docs/VENDORED.md and only closable by
    # upgrading Zebra SDK. Until then we don't want every PR to fail this gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dependency-check/Dependency-Check_Action@main
        with:
          project: zebrautil
          path: android/libs
          format: HTML
          out: reports
          args: >-
            --enableExperimental
            --failOnCVSS 11
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports
